<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="grad_hyperai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#210f38"/>
      <stop offset="60%" stop-color="#441a78"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <pattern id="pat_hyperai" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="card_glass_hyperai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.14)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#grad_hyperai)"/>
  <rect width="800" height="450" fill="url(#pat_hyperai)"/>

  <!-- Top Category Eyebrow Pill -->
  <rect x="48" y="36" width="340" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="64" y="57" fill="#8b5cf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1">CLUSTER TENSOR ENGINE</text>

  <!-- Top Right Code Chip -->
  <rect x="620" y="36" width="132" height="32" rx="8" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="686" y="57" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">GNN-TENSOR</text>

  <!-- Product Title -->
  <text x="48" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="900">HyperAI Neural Core</text>

  <!-- Core Capability Hero Banner Card -->
  <rect x="48" y="155" width="704" height="155" rx="16" fill="url(#card_glass_hyperai)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5"/>

  <!-- Accent Left Vertical Indicator -->
  <rect x="48" y="155" width="8" height="155" rx="4" fill="#8b5cf6"/>

  <!-- Highlight Statement -->
  <text x="76" y="205" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="700">High-Throughput Graph Neural Engine</text>

  <!-- Two Specification Badges Inside Card -->
  <g transform="translate(76, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="240" height="48" rx="8" fill="rgba(0, 0, 0, 0.55)" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="20" cy="24" r="5" fill="#8b5cf6"/>
    <text x="36" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700">Zero-Copy Shared Mem</text>

    <!-- Pill 2 -->
    <rect x="260" y="0" width="240" height="48" rx="8" fill="rgba(0, 0, 0, 0.55)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
    <circle cx="280" cy="24" r="5" fill="#10b981"/>
    <text x="296" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700">N-ary Tensor Kernels</text>
  </g>

  <!-- Footer Verification & Standard Bar -->
  <g transform="translate(48, 350)">
    <rect width="704" height="54" rx="10" fill="rgba(0, 0, 0, 0.65)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="28" cy="27" r="6" fill="#10b981"/>
    <text x="46" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600">Deterministic Architecture &#8226; <tspan fill="#8b5cf6">i2c Machine-Native Standard</tspan></text>
    <text x="680" y="32" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="700" text-anchor="end">ADR-001 &#8226; 100% PROVENANCE</text>
  </g>
</svg>
