<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E2640;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" /> <!-- Sky Blue -->
      <stop offset="50%" style="stop-color:#AF52DE;stop-opacity:1" /> <!-- Purple -->
      <stop offset="100%" style="stop-color:#FF2D55;stop-opacity:1" /> <!-- Pink/Red -->
    </linearGradient>
    
    <!-- Hyperedge glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" rx="16" fill="url(#bgGrad)" />

  <g transform="translate(40, 25)">
    <!-- HyperGraph Symbolic Art -->
    <g transform="translate(0, 0)">
      <!-- Hyperedge (glowing loop connecting multiple nodes) -->
      <path d="M 100 30 C 180 30, 200 170, 100 170 C 0 170, 20 30, 100 30 Z" 
            fill="none" 
            stroke="url(#accentGrad)" 
            stroke-width="6" 
            filter="url(#glow)" />
      
      <path d="M 100 70 C 140 70, 150 130, 100 130 C 50 130, 60 70, 100 70 Z" 
            fill="none" 
            stroke="#38BDF8" 
            stroke-width="2" 
            stroke-dasharray="4,4" />

      <!-- Nodes -->
      <!-- Node A (Top) -->
      <circle cx="100" cy="30" r="10" fill="#0B0F19" stroke="#38BDF8" stroke-width="4" />
      <!-- Node B (Bottom) -->
      <circle cx="100" cy="170" r="10" fill="#0B0F19" stroke="#FF2D55" stroke-width="4" />
      <!-- Node C (Left) -->
      <circle cx="45" cy="100" r="10" fill="#0B0F19" stroke="#AF52DE" stroke-width="4" />
      <!-- Node D (Right) -->
      <circle cx="155" cy="100" r="10" fill="#0B0F19" stroke="#AF52DE" stroke-width="4" />

      <!-- Inner nodes -->
      <circle cx="100" cy="70" r="6" fill="#38BDF8" />
      <circle cx="100" cy="130" r="6" fill="#FF2D55" />

      <!-- Connection Lines (Symbolic Graph) -->
      <line x1="100" y1="30" x2="45" y2="100" stroke="white" stroke-opacity="0.15" stroke-width="2" />
      <line x1="100" y1="30" x2="155" y2="100" stroke="white" stroke-opacity="0.15" stroke-width="2" />
      <line x1="100" y1="170" x2="45" y2="100" stroke="white" stroke-opacity="0.15" stroke-width="2" />
      <line x1="100" y1="170" x2="155" y2="100" stroke="white" stroke-opacity="0.15" stroke-width="2" />
    </g>

    <!-- Typography -->
    <g transform="translate(240, 115)">
      <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="68" 
            font-weight="900" 
            fill="white" 
            letter-spacing="1">Minh<tspan fill="url(#accentGrad)">AI</tspan></text>
      <text y="40" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="16" 
            font-weight="500" 
            fill="#94A3B8" 
            letter-spacing="4">MINI HYPER-GRAPH EDGE AGENT</text>
    </g>
  </g>
</svg>
